<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d26">
<title>Brain Brawl · Solo</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="../../fonts/games.css">
<style>
/* Brain Brawl, solo. The website version: one person against the clock, no server.
   Same look, questions and scoring as game night (Trivia, Fibber, Speed Round, Final Wager); Most Likely To needs friends, so it's left out. */
:root{
  color-scheme: dark;
  --night:#0a0d26; --spot:#1d2566; --desk:#161d50; --raise:#1d2660; --rail:#2a3479;
  --ink:#f2f1ff; --muted:#9ea5da; --gold:#ffc53d; --gold-2:#f08c00; --hot:#ff4f81; --teal:#3fd9c4; --good:#5ee391; --bad:#ff6b6b;
  --a0:#e84855; --a1:#3a86ff; --a2:#f4b400; --a3:#2bb673;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--night);background-image:radial-gradient(900px 500px at 50% -15%, var(--spot), transparent 72%);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:0 16px calc(14px + env(safe-area-inset-bottom))}
.cap{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(180deg,var(--night) 70%,transparent)}
.logo{font-family:var(--f-display);font-size:18px;line-height:1;color:var(--gold);white-space:nowrap;flex:none}
.where{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-size:13px}
.sc{margin-left:auto;text-align:right;font-family:var(--f-display);font-size:20px;line-height:1;white-space:nowrap}
.sc small{display:block;font-family:var(--f-cond);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.iconbtn{border:1px solid var(--rail);background:var(--desk);border-radius:10px;width:38px;height:38px;flex:none;font-size:16px}
.tbar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:var(--gold);width:100%;transform-origin:left}
.tbar.low i{background:var(--hot)}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:10px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.big{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,9vw,48px);line-height:1.05}
.gold{color:var(--gold)} .good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)}
.q{font-weight:800;font-size:clamp(19px,4.6vw,24px);line-height:1.25}
.sub{color:var(--muted);font-size:15px}
.card{background:var(--desk);border:1px solid var(--rail);border-radius:18px;padding:16px}
.qcard{background:var(--desk);border:1px solid var(--rail);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.qcard .meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--f-cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;border-radius:999px;padding:3px 9px;background:var(--raise);color:var(--muted)}
.tag.x2{background:var(--hot);color:#fff}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers.long{grid-template-columns:1fr}
.ans{position:relative;border:0;border-radius:18px;padding:14px 12px 16px;color:#fff;font-weight:800;font-size:18px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  box-shadow:inset 0 -6px 0 color-mix(in srgb,#000 22%,transparent);min-height:96px;transition:transform .08s,opacity .2s;overflow-wrap:anywhere}
.answers.long .ans{flex-direction:row;justify-content:flex-start;text-align:left;min-height:64px}
.ans:active:not(:disabled){transform:scale(.97)}
.ans .shape{width:28px;height:28px;background:#fff;flex:none}
.ans .key{position:absolute;top:8px;left:10px;font-family:var(--f-cond);font-size:13px;opacity:.75}
.ans.picked{box-shadow:0 0 0 4px #fff,inset 0 -6px 0 color-mix(in srgb,#000 22%,transparent)}
.ans.faded{opacity:.25}
.ans.right::after{content:"✓";position:absolute;top:-8px;right:-6px;width:30px;height:30px;border-radius:50%;background:var(--good);color:var(--night);display:grid;place-items:center;font-weight:900;box-shadow:0 0 0 3px var(--night)}
.a0{background:var(--a0)} .a1{background:var(--a1)} .a2{background:var(--a2)} .a3{background:var(--a3)} .a4{background:#8b6cff}
.s0{clip-path:polygon(50% 5%,95% 90%,5% 90%)} .s1{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)} .s2{border-radius:50%} .s3{border-radius:4px;transform:scale(.85)} .s4{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.btn{border:0;border-radius:16px;padding:15px;font-family:var(--f-display);font-size:20px;color:var(--night);background:linear-gradient(180deg,var(--gold),var(--gold-2));
  box-shadow:0 5px 0 color-mix(in srgb,var(--gold-2) 55%,var(--night));width:100%}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--gold-2) 55%,var(--night))}
.btn:disabled{opacity:.5}
.btn.alt{background:var(--raise);color:var(--ink);box-shadow:0 5px 0 var(--rail)}
.life{border:1px dashed var(--teal);background:none;color:var(--teal);border-radius:12px;padding:10px;font-weight:800;align-self:center;min-width:160px}
.picks{display:flex;flex-direction:column;gap:8px}
.opt{border:2px solid var(--rail);background:var(--desk);border-radius:14px;padding:14px;font-weight:800;font-size:18px;text-align:left;overflow-wrap:anywhere;width:100%}
.opt.picked{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--desk))}
.opt.truth{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--desk))}
.opt.faded{opacity:.3}
.buzz{width:min(70vw,280px);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#ff8aa8,var(--hot) 55%,#b0103d);color:#fff;font-family:var(--f-display);font-size:42px;
  box-shadow:0 12px 0 #8a0a2f,0 20px 60px color-mix(in srgb,var(--hot) 45%,transparent);transition:transform .05s;align-self:center}
.buzz:active:not(:disabled){transform:translateY(8px);box-shadow:0 4px 0 #8a0a2f}
.range{width:100%;accent-color:var(--gold);height:40px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips button{border:1px solid var(--rail);background:var(--desk);border-radius:10px;padding:10px 4px;font-weight:800}
.wager{font-family:var(--f-display);font-size:42px;color:var(--gold);text-align:center;line-height:1}
.result{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px;border-radius:22px;text-align:center;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.result.win{background:color-mix(in srgb,var(--good) 22%,var(--desk));box-shadow:inset 0 0 0 2px var(--good)}
.result.lose{background:color-mix(in srgb,var(--bad) 18%,var(--desk));box-shadow:inset 0 0 0 2px var(--bad)}
.result.meh{background:var(--desk);box-shadow:inset 0 0 0 1px var(--rail)}
.result .pts{font-family:var(--f-display);font-size:40px;line-height:1}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.lines{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.lines div{background:var(--desk);border-radius:12px;padding:10px 12px;font-weight:700;display:flex;align-items:center;gap:10px}
.lines span.i{font-size:24px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:2px solid var(--rail);background:var(--desk);border-radius:12px;padding:10px 6px;font-weight:800;line-height:1.15}
.seg button small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--desk))}
.field{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.words{font-weight:800;font-size:clamp(20px,5vw,26px);line-height:1.3;min-height:3.9em}
.words .ghost{opacity:.15}
.paused{position:fixed;inset:0;z-index:15;display:grid;place-items:center;align-content:center;gap:18px;background:color-mix(in srgb,var(--night) 82%,transparent);backdrop-filter:blur(3px);font-family:var(--f-display);font-size:40px;color:var(--gold)}
.paused .btn{width:auto;padding:12px 28px;font-size:18px}
@media (prefers-reduced-motion:reduce){.result{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="logo">Brain Brawl</span>
    <span class="where" id="where">Solo</span>
    <span class="sc" id="score" hidden><span id="scoreN">0</span><small>points</small></span>
    <button class="iconbtn" id="pauseBtn" type="button" aria-label="Pause" hidden>⏸</button>
  </header>
  <div class="tbar" id="tbar" hidden><i id="tfill"></i></div>
  <main id="main"></main>
  <p class="sr-only" id="live" aria-live="polite" style="position:absolute;left:-9999px"></p>
</div>
<div class="paused" id="paused" hidden><span>Paused</span><button class="btn" id="resumeBtn" type="button">Resume</button></div>

<script src="pack.js"></script>
<script>
'use strict';
const PACK = window.BB_PACK;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = n => { const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => Math.round(n).toLocaleString('en-US');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: nothing is remembered */ } },
};
const hashOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
// every Fibber answer is shown in the same lowercase style, so the real one can't be spotted by its capitals (same as game night)
const look = t => String(t).trim().replace(/[.!]+$/, '').toLowerCase();

// ---------- the same rules as game night ----------
const PACE = { relaxed: 1.5, normal: 1, fast: 0.75 };
const T = { mc: 20000, tf: 12000, choose: 25000, speedHold: 9000, buzz: 7000, wager: 20000, finalAsk: 30000 };
const LENGTHS = {
  quick: [['trivia', 6, 1], ['fibber', 2, 1], ['speed', 4, 1], ['final', 1, 1]],
  standard: [['trivia', 6, 1], ['fibber', 3, 1], ['speed', 5, 1], ['trivia', 5, 2], ['final', 1, 1]],
};
const TYPES = {
  trivia: { title: 'Trivia', blurb: 'Pick the right answer. Faster answers score more, and streaks add bonus points.' },
  fibber: { title: 'Fibber', blurb: 'One of these is a weird but true fact. The rest are lies. Find the truth.' },
  speed: { title: 'Speed Round', blurb: 'The question appears word by word. Buzz the moment you know it. Early buzzes score more; wrong buzzes lose points.' },
  final: { title: 'Final Wager', blurb: 'Bet some of your points on one last hard question.' },
};
const SHAPES = ['s0', 's1', 's2', 's3', 's4'];

// ---------- questions: the built-in pack, no repeats until it runs out ----------
const POOL = [];
for (const [cat, diff, text, answer, wrong] of PACK.MC) POOL.push({ id: 'q' + hashOf(text), type: 'mc', cat: cat.replace(/^Entertainment: /, ''), diff, text, answer, wrong });
for (const [text, truth] of PACK.TF) POOL.push({ id: 'q' + hashOf(text), type: 'tf', cat: 'True or False', diff: 'easy', text, answer: truth ? 'True' : 'False', wrong: [truth ? 'False' : 'True'] });
const FIBS = PACK.FIB.map(([prompt, truth, lies]) => ({ id: 'f' + hashOf(prompt), prompt, truth, lies }));
const ASKED_KEY = 'brainbrawl.solo.asked';
let asked = new Set(store.get(ASKED_KEY, []));
function remember(id) { asked.add(id); store.set(ASKED_KEY, [...asked].slice(-400)); }
function take(list, n, filter, prefer, used) {
  const cands = list.filter(q => filter(q) && !used.has(q.id));
  let fresh = cands.filter(q => !asked.has(q.id));
  if (fresh.length < n) { for (const q of cands) asked.delete(q.id); fresh = cands.slice(); }
  shuffle(fresh);
  if (prefer) fresh.sort((a, b) => prefer(b) - prefer(a));
  const out = fresh.slice(0, n);
  for (const q of out) used.add(q.id);
  return out;
}
function asTrivia(q) {
  const options = q.type === 'tf' ? ['True', 'False'] : shuffle([q.answer, ...q.wrong.slice(0, 3)]);
  return { id: q.id, type: q.type, cat: q.cat, diff: q.diff, text: q.text, options, correct: options.indexOf(q.answer) };
}
function buildItems(type, n, used) {
  if (type === 'trivia') {
    const tfN = Math.round(n * 0.2);
    return shuffle([...take(POOL, n - tfN, q => q.type === 'mc', null, used), ...take(POOL, tfN, q => q.type === 'tf', null, used)]).map(asTrivia);
  }
  if (type === 'speed') return take(POOL, n, q => q.type === 'mc' && q.text.split(' ').length >= 6, q => (q.diff === 'medium' ? 1 : 0), used).map(asTrivia);
  if (type === 'final') return take(POOL, 1, q => q.type === 'mc', q => (q.diff === 'hard' ? 3 : q.diff === 'medium' ? 1 : 0), used).map(asTrivia);
  if (type === 'fibber') return take(FIBS, n, () => true, null, used).map(f => {
    const opts = shuffle([{ text: look(f.truth), truth: true }, ...f.lies.slice(0, 4).map(l => ({ text: look(l), truth: false }))]);
    return { id: f.id, type: 'fib', prompt: f.prompt, options: opts.map(o => o.text), correct: opts.findIndex(o => o.truth) };
  });
  return [];
}

// ---------- a countdown that can pause ----------
let clock = null;
class Countdown {
  constructor(ms, onEnd, onTick) {
    this.ms = ms; this.onEnd = onEnd; this.onTick = onTick; this.t0 = performance.now(); this.pausedAt = null; this.pausedFor = 0; this.dead = false;
    const loop = () => {
      if (this.dead) return;
      if (this.pausedAt == null) {
        const left = this.left();
        if (this.onTick) this.onTick(this.elapsed(), left);
        bar(left / this.ms);
        if (left <= 0) { this.dead = true; this.onEnd(); return; }
      }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  elapsed() { return (this.pausedAt != null ? this.pausedAt : performance.now()) - this.t0 - this.pausedFor; }
  left() { return Math.max(0, this.ms - this.elapsed()); }
  pause() { if (this.pausedAt == null) this.pausedAt = performance.now(); }
  resume() { if (this.pausedAt != null) { this.pausedFor += performance.now() - this.pausedAt; this.pausedAt = null; } }
  stop() { this.dead = true; cancelAnimationFrame(this.raf); }
}
function startClock(ms, onEnd, onTick) { stopClock(); $('tbar').hidden = false; $('pauseBtn').hidden = false; clock = new Countdown(ms, onEnd, onTick); }
function stopClock() { if (clock) clock.stop(); clock = null; $('tbar').hidden = true; $('pauseBtn').hidden = true; }
function bar(frac) { const f = Math.max(0, Math.min(1, frac)); $('tfill').style.transform = `scaleX(${f})`; $('tbar').classList.toggle('low', f < 0.25); }
function pause() { if (!clock || clock.dead) return; clock.pause(); $('paused').hidden = false; $('resumeBtn').focus(); }
function resume() { if (clock) clock.resume(); $('paused').hidden = true; }
$('pauseBtn').onclick = pause;
$('resumeBtn').onclick = resume;
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------- game state ----------
const settings = Object.assign({ length: 'standard', pace: 'normal' }, store.get('brainbrawl.solo.settings', {}));
let G = null, keyHandler = null;
const pace = ms => Math.round(ms * (PACE[settings.pace] || 1));
function say(text) { $('live').textContent = text; }
function setMain(html) { $('main').innerHTML = html; const f = $('main').querySelector('[autofocus]'); if (f) f.focus(); }
function setScore() { $('score').hidden = !G; if (G) $('scoreN').textContent = fmt(G.score); }
function where(text) { $('where').textContent = text; }
document.addEventListener('keydown', e => { if (keyHandler && !e.metaKey && !e.ctrlKey && !e.altKey && $('paused').hidden) keyHandler(e); });

function newGame() {
  const used = new Set();
  const rounds = LENGTHS[settings.length].map(([type, count, mult]) => ({ type, mult, items: buildItems(type, count, used) })).filter(r => r.items.length);
  G = { rounds, ri: 0, qi: 0, score: 0, streak: 0, bestStreak: 0, correct: 0, asked: 0, fastSum: 0, fastN: 0, buzzWins: 0, lifeline: true, finalWon: null };
  setScore();
  roundIntro();
}
const round = () => G.rounds[G.ri];
const item = () => round().items[G.qi];

// ---------- screens ----------
function home() {
  stopClock(); G = null; setScore(); where('Solo');
  const best = store.get('brainbrawl.solo.best', null);
  setMain(`<div class="center">
    <div class="big gold">Brain Brawl</div>
    <p class="sub" style="max-width:34ch">Solo trivia against the clock: Trivia, Fibber, a Speed Round and a Final Wager, with the same scoring as game night.</p>
    <div class="card" style="width:100%;display:flex;flex-direction:column;gap:14px">
      <div class="field"><span class="cap">Length</span><div class="seg two" id="len">
        <button type="button" data-v="quick" aria-pressed="${settings.length === 'quick'}">Quick<small>13 questions</small></button>
        <button type="button" data-v="standard" aria-pressed="${settings.length === 'standard'}">Standard<small>20 questions</small></button></div></div>
      <div class="field"><span class="cap">Timers</span><div class="seg" id="pace">
        <button type="button" data-v="relaxed" aria-pressed="${settings.pace === 'relaxed'}">Relaxed</button>
        <button type="button" data-v="normal" aria-pressed="${settings.pace === 'normal'}">Normal</button>
        <button type="button" data-v="fast" aria-pressed="${settings.pace === 'fast'}">Fast</button></div></div>
    </div>
    ${best ? `<p class="sub">Your best: <b class="gold">${fmt(best.score)}</b> points</p>` : ''}
    <button class="btn" id="go" type="button" autofocus>Start</button>
    <p class="sub" style="font-size:13px">At game night everyone plays on their phones with the questions on a TV, plus Most Likely To and a buzzer race. Keys: 1 to 5 to answer, Space to buzz or go on.</p>
  </div>`);
  for (const [id, key] of [['len', 'length'], ['pace', 'pace']]) {
    $(id).onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      settings[key] = b.dataset.v; store.set('brainbrawl.solo.settings', settings);
      for (const x of $(id).children) x.setAttribute('aria-pressed', x === b);
    };
  }
  $('go').onclick = newGame;
  keyHandler = null;
}

function roundIntro() {
  stopClock();
  const r = round(), t = TYPES[r.type];
  where(`Round ${G.ri + 1} of ${G.rounds.length}`);
  setMain(`<div class="center">
    <span class="cap">Round ${G.ri + 1} of ${G.rounds.length}</span>
    <div class="big gold">${esc(t.title)}</div>
    ${r.mult > 1 ? '<span class="tag x2">Double Trouble: every point ×2</span>' : ''}
    <p class="sub" style="max-width:36ch">${esc(t.blurb)}</p>
    <p class="sub">${r.items.length} question${r.items.length === 1 ? '' : 's'}${G.lifeline && r.type !== 'final' && r.type !== 'speed' ? ' · your 50:50 is still unused' : ''}</p>
    <button class="btn" id="go" type="button" autofocus>Let's go</button>
  </div>`);
  say(`${t.title}. ${t.blurb}`);
  $('go').onclick = startItem;
  keyHandler = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startItem(); } };
}

function startItem() {
  const r = round();
  where(`${TYPES[r.type].title} · ${G.qi + 1} of ${r.items.length}`);
  if (r.type === 'trivia') return askScreen(item(), pace(item().type === 'tf' ? T.tf : T.mc));
  if (r.type === 'fibber') return askScreen(item(), pace(T.choose));
  if (r.type === 'speed') return speedScreen(item());
  if (r.type === 'final') return wagerScreen(item());
}

function qcard(it, extraTags) {
  const r = round();
  const text = it.type === 'fib' ? esc(it.prompt).replace(/_{2,}/g, '<span class="gold">_____</span>') : esc(it.text);
  const tags = [it.cat ? esc(it.cat) : null, it.diff && it.diff !== 'easy' ? esc(it.diff) : null, ...(extraTags || [])].filter(Boolean);
  return `<div class="qcard"><div class="meta">${tags.map(t => `<span class="tag">${t}</span>`).join('')}${r.mult > 1 ? '<span class="tag x2">×2</span>' : ''}</div>
    <p class="q">${text}</p></div>`;
}
function answerButtons(it, disabled) {
  const long = it.type === 'fib' || it.options.some(o => o.length > 22);
  return `<div class="answers${long ? ' long' : ''}" id="answers">${it.options.map((o, i) => `<button class="ans a${i % 5}" type="button" data-i="${i}" ${disabled ? 'disabled' : ''}>
      <span class="key" aria-hidden="true">${i + 1}</span><span class="shape ${SHAPES[i % 5]}" aria-hidden="true"></span><span>${esc(o)}</span></button>`).join('')}</div>`;
}

// Trivia, Fibber and the Final Wager question
function askScreen(it, ms, final) {
  const canFifty = G.lifeline && !final;
  setMain(`${qcard(it, it.type === 'fib' ? ['Find the truth'] : null)}
    ${answerButtons(it)}
    ${canFifty ? '<button class="life" id="fifty" type="button">50:50 (once a game)</button>' : ''}`);
  say(it.type === 'fib' ? it.prompt.replace(/_{2,}/g, 'blank') : it.text);
  let done = false;
  const pickAt = i => {
    if (done) return; done = true;
    const t = clock ? clock.elapsed() : ms;
    stopClock();
    reveal(it, i, t, ms, final);
  };
  $('answers').onclick = e => { const b = e.target.closest('.ans'); if (b && !b.disabled) pickAt(Number(b.dataset.i)); };
  if (canFifty) $('fifty').onclick = () => {
    G.lifeline = false;
    const wrong = shuffle(it.options.map((_, i) => i).filter(i => i !== it.correct));
    const keep = new Set([it.correct, wrong[0]]);
    for (const b of document.querySelectorAll('#answers .ans')) if (!keep.has(Number(b.dataset.i))) { b.disabled = true; b.classList.add('faded'); }
    $('fifty').remove();
  };
  keyHandler = e => { const n = Number(e.key); if (n >= 1 && n <= it.options.length) { const b = document.querySelector(`#answers .ans[data-i="${n - 1}"]`); if (b && !b.disabled) pickAt(n - 1); } };
  startClock(ms, () => pickAt(-1));
}

function reveal(it, choice, t, limit, final) {
  const r = round(), right = choice === it.correct;
  for (const b of document.querySelectorAll('#answers .ans')) {
    const i = Number(b.dataset.i);
    b.disabled = true;
    if (i === it.correct) b.classList.add('right');
    else b.classList.add('faded');
    if (i === choice) b.classList.add('picked');
  }
  const f = $('fifty'); if (f) f.remove();
  let pts = 0, line = '';
  G.asked += 1;
  if (final) {
    pts = right ? G.wager : -G.wager; G.finalWon = right;
    if (right) G.correct += 1;
    line = right ? `You bet ${fmt(G.wager)} and won it.` : choice < 0 ? `Out of time. You lose your ${fmt(G.wager)}.` : `You bet ${fmt(G.wager)} and lost it.`;
  } else if (right) {
    G.streak += 1; G.bestStreak = Math.max(G.bestStreak, G.streak); G.correct += 1;
    if (it.type === 'fib') pts = 1000 * r.mult;
    else {
      G.fastSum += t; G.fastN += 1;
      // Kahoot's formula, same as game night: up to 1000, losing up to half for slower answers; plus up to 500 for streaks
      const base = Math.round((1 - Math.min(1, t / limit) / 2) * 1000);
      const streakBonus = Math.min(500, Math.max(0, G.streak - 1) * 100);
      pts = Math.round((base + streakBonus) * r.mult);
      line = G.streak > 1 ? `🔥 ${G.streak} in a row (+${fmt(streakBonus * r.mult)} streak bonus)` : `Answered in ${(t / 1000).toFixed(1)}s`;
    }
    if (it.type === 'fib') line = 'You found the truth.';
  } else {
    G.streak = 0;
    line = choice < 0 ? 'Out of time.' : it.type === 'fib' ? "That one's a lie." : 'Not quite.';
  }
  G.score += pts; setScore();
  const answer = it.options[it.correct];
  const cls = pts > 0 ? 'win' : pts < 0 ? 'lose' : 'meh';
  const head = pts > 0 ? `+${fmt(pts)}` : pts < 0 ? `−${fmt(-pts)}` : choice < 0 ? '⏱' : '✗';
  $('main').insertAdjacentHTML('beforeend', `<div class="result ${cls}"><span class="pts">${head}</span><span style="font-weight:800">${esc(line)}</span>
    ${right ? '' : `<span class="sub">The answer: <b style="color:var(--ink)">${esc(answer)}</b></span>`}</div>
    <button class="btn" id="next" type="button">Next</button>`);
  remember(it.id);
  say(`${right ? 'Right' : 'Wrong'}. ${pts ? (pts > 0 ? 'Plus ' : 'Minus ') + fmt(Math.abs(pts)) + ' points.' : ''} The answer was ${answer}.`);
  $('next').onclick = next; $('next').focus();
  keyHandler = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
}

// Speed Round: the question appears word by word; buzz, then pick from four answers
function speedScreen(it) {
  const r = round(), words = it.text.split(/\s+/), revealMs = Math.min(8000, words.length * 300), readMs = revealMs + pace(T.speedHold);
  setMain(`${qcard({ ...it, text: '' }, ['Buzz when you know it'])}
    <p class="words" id="words" aria-hidden="true"></p>
    <button class="buzz" id="buzz" type="button">BUZZ</button>`);
  $('main').querySelector('.q').remove();
  const showWords = n => { $('words').innerHTML = words.map((w, i) => `<span class="${i < n ? '' : 'ghost'}">${esc(w)}</span>`).join(' '); };
  showWords(0);
  say('Speed round. ' + it.text);
  let buzzed = false;
  const buzz = () => {
    if (buzzed) return; buzzed = true;
    const el = clock ? clock.elapsed() : readMs;
    const frac = Math.min(1, el / revealMs);
    stopClock(); showWords(words.length);
    $('buzz').remove();
    $('main').insertAdjacentHTML('beforeend', `<p class="cap" style="text-align:center">Buzzed! Pick your answer</p>${answerButtons(it)}`);
    let done = false;
    const pickAt = i => {
      if (done) return; done = true; stopClock();
      speedResult(it, i, frac);
    };
    $('answers').onclick = e => { const b = e.target.closest('.ans'); if (b && !b.disabled) pickAt(Number(b.dataset.i)); };
    keyHandler = e => { const n = Number(e.key); if (n >= 1 && n <= it.options.length) pickAt(n - 1); };
    const first = $('answers').querySelector('.ans'); if (first) first.focus();
    startClock(pace(T.buzz), () => pickAt(-1));
  };
  $('buzz').onclick = buzz; $('buzz').focus();
  keyHandler = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); buzz(); } };
  startClock(readMs, () => {
    if (buzzed) return; buzzed = true;
    showWords(words.length); $('buzz').remove();
    $('main').insertAdjacentHTML('beforeend', answerButtons(it, true));
    speedResult(it, null, 1);
  }, el => showWords(Math.min(words.length, Math.ceil(el / (revealMs / words.length)))));
  void r;
}
function speedResult(it, choice, frac) {
  const r = round();
  let pts = 0, line = '';
  G.asked += 1;
  if (choice == null) { line = 'Nobody buzzed. No points either way.'; G.streak = 0; }
  else if (choice === it.correct) {
    pts = Math.round((1000 - 500 * frac) * r.mult);       // same as game night: earlier buzzes score more
    G.buzzWins += 1; G.correct += 1; G.streak += 1; G.bestStreak = Math.max(G.bestStreak, G.streak);
    line = frac < 1 ? `Buzzed with ${Math.round((1 - frac) * 100)}% of the question still to come.` : 'Buzzed after the whole question.';
  } else {
    pts = -Math.round(300 * r.mult); G.streak = 0;
    line = choice < 0 ? 'Out of time after buzzing.' : 'Wrong buzz.';
  }
  for (const b of document.querySelectorAll('#answers .ans')) {
    const i = Number(b.dataset.i); b.disabled = true;
    b.classList.add(i === it.correct ? 'right' : 'faded'); if (i === choice) b.classList.add('picked');
  }
  G.score += pts; setScore();
  const cls = pts > 0 ? 'win' : pts < 0 ? 'lose' : 'meh';
  $('main').insertAdjacentHTML('beforeend', `<div class="result ${cls}"><span class="pts">${pts > 0 ? '+' + fmt(pts) : pts < 0 ? '−' + fmt(-pts) : '—'}</span><span style="font-weight:800">${esc(line)}</span>
    ${choice === it.correct ? '' : `<span class="sub">The answer: <b style="color:var(--ink)">${esc(it.options[it.correct])}</b></span>`}</div>
    <button class="btn" id="next" type="button">Next</button>`);
  remember(it.id);
  say(`${line} The answer was ${it.options[it.correct]}.`);
  $('next').onclick = next; $('next').focus();
  keyHandler = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
}

// Final Wager: see the category, bet, then answer
function wagerScreen(it) {
  const max = Math.max(500, G.score);       // at least 500 is always allowed, same as game night
  G.wager = Math.min(max, Math.round(max / 2 / 50) * 50);
  setMain(`<div class="center" style="justify-content:flex-start">
    <span class="cap">The category</span><div class="big gold" style="font-size:clamp(26px,7vw,40px)">${esc(it.cat)}</div>
    <p class="sub">How much do you bet? You can bet up to ${fmt(max)}.</p>
    <div class="card" style="width:100%;display:flex;flex-direction:column;gap:12px">
      <div class="wager" id="wv">${fmt(G.wager)}</div>
      <input class="range" id="wr" type="range" min="0" max="${max}" step="${max >= 2000 ? 50 : 10}" value="${G.wager}" aria-label="Your bet">
      <div class="chips" id="wc"><button type="button" data-f="0">None</button><button type="button" data-f=".25">¼</button><button type="button" data-f=".5">½</button><button type="button" data-f="1">All</button></div>
    </div>
    <button class="btn" id="lock" type="button">Lock it in</button></div>`);
  const set = v => { G.wager = Math.max(0, Math.min(max, Math.round(v))); $('wv').textContent = fmt(G.wager); $('wr').value = G.wager; };
  $('wr').oninput = e => set(Number(e.target.value));
  $('wc').onclick = e => { const b = e.target.closest('button'); if (b) set(max * Number(b.dataset.f)); };
  const lock = () => { stopClock(); askScreen(it, pace(T.finalAsk), true); };
  $('lock').onclick = lock; $('lock').focus();
  keyHandler = e => { if (e.key === 'Enter') { e.preventDefault(); lock(); } };
  say(`Final wager. The category is ${it.cat}. Bet up to ${max} points.`);
  startClock(pace(T.wager), lock);
}

function next() {
  keyHandler = null;
  G.qi += 1;
  if (G.qi < round().items.length) return startItem();
  G.ri += 1; G.qi = 0;
  if (G.ri >= G.rounds.length) return end();
  between();
}
function between() {
  stopClock();
  where('Scores');
  setMain(`<div class="center">
    <span class="cap">After round ${G.ri} of ${G.rounds.length}</span>
    <div class="big gold">${fmt(G.score)}</div><p class="sub">points so far · ${G.correct} of ${G.asked} right${G.streak > 1 ? ` · 🔥 ${G.streak} in a row` : ''}</p>
    <p class="sub">Next up: <b style="color:var(--ink)">${esc(TYPES[round().type].title)}</b>${round().mult > 1 ? ' <span class="tag x2">×2</span>' : ''}</p>
    <button class="btn" id="go" type="button" autofocus>Continue</button></div>`);
  $('go').onclick = roundIntro;
  keyHandler = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); roundIntro(); } };
}

function end() {
  stopClock(); where('Final score');
  const best = store.get('brainbrawl.solo.best', null), isBest = !best || G.score > best.score;
  if (isBest) store.set('brainbrawl.solo.best', { score: G.score, date: new Date().toISOString().slice(0, 10) });
  const awards = [];
  if (G.correct >= Math.max(3, Math.ceil(G.asked * 0.8))) awards.push(['🧠', 'Big Brain', `${G.correct} of ${G.asked} right`]);
  if (G.fastN >= 3) awards.push(['⚡', 'Fastest Finger', `${(G.fastSum / G.fastN / 1000).toFixed(1)}s average`]);
  if (G.bestStreak >= 3) awards.push(['🔥', 'Hot Streak', `${G.bestStreak} in a row`]);
  if (G.buzzWins) awards.push(['🔔', 'Buzzer Beater', `${G.buzzWins} speed-round win${G.buzzWins === 1 ? '' : 's'}`]);
  if (G.finalWon && G.wager >= 1000) awards.push(['🎲', 'High Roller', `won a ${fmt(G.wager)} wager`]);
  setMain(`<div class="center">
    <span class="cap">Final score</span>
    <div class="big gold">${fmt(G.score)}</div>
    ${isBest ? '<p style="font-weight:800" class="good">🏆 New personal best!</p>' : `<p class="sub">Your best: ${fmt(best.score)}</p>`}
    <p class="sub">${G.correct} of ${G.asked} right · best streak ${G.bestStreak}</p>
    ${awards.length ? `<div class="lines">${awards.map(([i, t, x]) => `<div><span class="i" aria-hidden="true">${i}</span><span><b>${t}</b><br><span class="sub">${esc(x)}</span></span></div>`).join('')}</div>` : ''}
    <button class="btn" id="again" type="button" autofocus>Play again</button>
    <button class="btn alt" id="menu" type="button">Change settings</button></div>`);
  say(`Final score ${G.score}.`);
  $('again').onclick = newGame; $('menu').onclick = home;
  keyHandler = null;
}

home();
</script>
</body>
</html>
